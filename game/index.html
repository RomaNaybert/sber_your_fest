<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#29213f"><meta name="description" content="Устрой свой фестиваль: компания растёт, погода меняется, а покупки путешествуют с тобой."><title data-copy="html.text001">Твой фестиваль</title><link rel="icon" href="./assets/coin.webp"><link rel="stylesheet" href="./styles.css?v=festival14"></head><body>
<main class="app" id="app">
<section class="world" id="world"><canvas id="scene" aria-label="Твоя площадка для праздника" data-copy-aria="html.aria01"></canvas>
<header class="hud"><button class="icon-button" id="exit-button" aria-label="Выйти из игры" data-copy-aria="html.aria02"><img src="./assets/icon-back.webp" alt=""></button><div class="hud-right"><div class="wallet" aria-label="Остаток игровых монет" data-copy-aria="html.aria03"><img src="./assets/coin.webp" alt=""><b id="balance">300</b></div><button class="icon-button" id="sound-button" aria-label="Включить звук" data-copy-aria="html.aria04" aria-pressed="false"><img src="./assets/icon-sound-off.webp" alt=""></button></div></header>
<article class="mission" id="mission"><div class="mission-top"><div><h1 id="location-text" data-copy="html.text002">Пикник на лужайке</h1><p id="weather-text" data-copy="html.text003">3 друга · Ясно</p></div><button class="help-button" id="help-button" aria-label="Условия праздника" data-copy-aria="html.aria05"><img src="./assets/icon-help.webp" alt=""></button></div><div class="needs" id="needs" aria-label="Что нужно друзьям" data-copy-aria="html.aria06"></div></article>
<div id="zone-buttons" class="zone-buttons" aria-label="Места для покупок" data-copy-aria="html.aria07"></div><div id="prop-buttons" class="prop-buttons" aria-label="Твои покупки" data-copy-aria="html.aria08"></div>
<section class="prop-popover" id="prop-popover" role="group" aria-labelledby="prop-title" hidden><div class="prop-caption"><b id="prop-title"></b><span id="prop-price"></span><button id="cancel-selection" class="small-close" aria-label="Снять выбор" data-copy-aria="html.aria09"><img src="./assets/icon-close.webp" alt=""></button></div><p class="prop-helper-detail" id="prop-helper-detail" hidden></p><div class="helper-actions" id="helper-actions" hidden><button id="reassign-helper-button" data-copy="html.text004">К другой покупке</button><button id="detach-helper-button" data-copy="html.text005">Отпустить</button></div><div class="selection-actions" id="selection-actions"><button id="move-button" data-copy="html.text006">Переставить</button><button id="refund-button" data-copy="html.text007">Вернуть</button></div></section>
<div class="friend-speech" id="friend-speech" role="status" hidden></div>
</section>
<aside class="drawer" id="drawer" aria-label="Покупки и действия" data-copy-aria="html.aria10">
<div id="shop-panel" class="shop-panel">
<div class="tabs" role="tablist" aria-label="Виды покупок" data-copy-aria="html.aria11"><button data-category="music" role="tab" aria-selected="false"><img src="./assets/icon-music.webp" alt=""><span data-copy="html.text008">Музыка</span></button><button data-category="food" role="tab" aria-selected="true"><img src="./assets/icon-food.webp" alt=""><span data-copy="html.text009">Еда</span></button><button data-category="shelter" role="tab" aria-selected="false"><img src="./assets/icon-shelter.webp" alt=""><span data-copy="html.text010">Укрытие</span></button><button data-category="decoration" role="tab" aria-selected="false"><img src="./assets/icon-flower.webp" alt=""><span data-copy="html.text011">Украшения</span></button><button data-category="crew" role="tab" aria-selected="false" hidden><img src="./assets/pix.webp" alt=""><span data-copy="html.text012">Команда</span></button></div>
<div id="shop-grid" class="shop-grid" aria-label="Выбери покупку" data-copy-aria="html.aria12"></div>
<div class="coach" id="coach"><div class="coach-text"><b id="coach-title" data-copy="html.text013">Устроим пикник?</b><p id="coach-copy" data-copy="html.text014">Выбери еду, затем коснись свободного места.</p></div><button id="cancel-pick" class="small-close" aria-label="Отменить выбор покупки" data-copy-aria="html.aria13" hidden><img src="./assets/icon-close.webp" alt=""></button></div>
<div class="drawer-actions"><button class="icon-button" id="undo-button" aria-label="Отменить последнее действие" data-copy-aria="html.aria14" disabled><img src="./assets/icon-undo.webp" alt=""></button><button class="ticket-button" id="rehearse-button" data-copy="html.text015">Позвать друзей <img src="./assets/icon-share.webp" alt=""></button></div>
</div>
<section class="celebration" id="celebration" hidden><h2 id="celebration-title" data-copy="html.text016">Праздник получился!</h2><p id="celebration-copy"></p><div class="result-rating" id="party-rating"></div><p class="journey" id="journey-copy"></p><button class="ticket-button" id="next-button" data-copy="html.text017">Пойдём дальше <img src="./assets/icon-share.webp" alt=""></button><button class="text-button" id="change-button" data-copy="html.text018">Попробовать ещё</button></section>
<section class="finale" id="finale" hidden><h2 id="final-title" data-copy="html.text019">Получилось даже в ливень!</h2><div class="result-rating" id="final-rating"></div><p id="final-copy" data-copy="html.text020">Все семеро сыты, слышат музыку и не мокнут.</p><div class="final-stats" id="final-stats"></div><button class="ticket-button" id="share-button" data-copy="html.text021">Поделиться праздником <img src="./assets/icon-share.webp" alt=""></button><button class="secondary bonus-button" id="bonus-button" hidden data-copy="html.text022">Пойдём дальше</button><button class="text-button" id="improve-button" data-copy="html.text023">Попробовать ещё</button><button class="text-button" id="restart-button" data-copy="html.text024">Начать сначала</button></section>
<div class="return-drop" id="return-drop" role="status" hidden><img src="./assets/coin.webp" alt=""><span id="return-drop-copy"></span><small data-copy="html.text025">Отпусти предмет здесь</small></div></aside>
<div class="boot" id="boot"><img src="./assets/coin.webp" alt=""><p data-copy="html.text026">Собираемся…</p></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="modal-scrim" id="modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="modal-close" class="icon-button modal-close" aria-label="Закрыть" data-copy-aria="html.aria15"><img src="./assets/icon-close.webp" alt=""></button><h2 id="modal-title"></h2><div id="modal-body"></div><p class="modal-scroll-hint" id="modal-scroll-hint" hidden data-copy="html.text027">Ниже ещё немного ↓</p><div id="modal-actions" class="modal-actions"></div></section></div>
<div class="drag-ghost" id="drag-ghost" hidden></div>
</main><script type="module" src="./app.js?v=festival14"></script></body></html>
