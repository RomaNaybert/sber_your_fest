<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Студия фестиваля</title><link rel="stylesheet" href="./styles.css"></head><body>
<header><div><span class="eyebrow">ФЕСТИВАЛЬ · КОНТЕНТ</span><h1>Студия фестиваля</h1><p>Меняй задания, покупки и тексты без редактирования кода.</p></div><div class="header-actions"><button id="import-button">Открыть файл</button><input id="import-file" type="file" accept=".json,application/json" hidden><button id="validate-button">Проверить</button><button id="export-button" class="primary">Скачать для игры</button></div></header>
<div class="workspace"><aside><nav aria-label="Разделы студии"><button data-section="items" aria-current="page">Покупки <span id="items-count"></span></button><button data-section="scenarios">Площадки <span id="scenarios-count"></span></button><button data-section="copy">Тексты интерфейса <span id="copy-count"></span></button><button data-section="settings">Настройки игры</button><button data-section="review">Проверка и экспорт</button></nav><p id="file-status" role="status">Загружаем текущую версию…</p><p class="aside-note">Изменения остаются в этой вкладке. Скачанный файл публикует ответственный за игру.</p><a href="../game/" target="_blank" rel="noopener">Открыть текущую игру ↗</a></aside>
<main><div class="section-heading"><div><h2 id="section-title">Покупки</h2><p id="section-description"></p></div><label id="search-label">Найти<input id="search" type="search" placeholder="Название или текст"></label></div><div id="editor" aria-live="polite"></div></main></div>
<div id="notice" role="status" hidden></div><dialog id="preview-dialog"><div class="dialog-header"><h2>Предпросмотр</h2><button id="preview-close" aria-label="Закрыть предпросмотр">Закрыть</button></div><p id="preview-status" role="status">Ожидаем подтверждение игры.</p><iframe id="preview-frame" title="Предпросмотр фестиваля"></iframe></dialog>
<script type="module" src="./app.js"></script></body></html>
